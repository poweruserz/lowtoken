[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lowtoken"
version = "0.1.0"
description = "Pay less rent on your LLM context: exact Claude token accounting and verified-lossless context compression for Claude Code."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = []
keywords = ["claude", "claude-code", "tokens", "llm", "context", "compression", "prompt-cache", "cost"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Software Development",
]

[project.optional-dependencies]
fast = ["tiktoken>=0.7"]
dev = ["pytest>=8"]

[project.scripts]
lowtoken = "lowtoken.cli:main"

[tool.setuptools]
packages = ["lowtoken"]
